[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-foldercraft"
version = "5.0.0"
description = "Reorganise Adobe Lightroom Classic folder trees by date, camera and more, without losing the catalog connection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR GPL-3.0-or-later" }
authors = [{ name = "Andreas Freund" }]
keywords = ["lightroom", "lrcat", "photography", "catalog", "photo-management", "tui", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
# The core tool runs on a bare Python installation -- only sqlite3 and the
# standard library. Everything optional lives in the extras below.
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.47"]
gui = ["PySide6-Essentials>=6.5"]
dev = [
    "textual>=0.47",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://gitlab.com/andy-freund/LR-FolderCraft"
Repository = "https://gitlab.com/andy-freund/LR-FolderCraft"
Documentation = "https://gitlab.com/andy-freund/LR-FolderCraft/-/tree/main/docs"
Issues = "https://gitlab.com/andy-freund/LR-FolderCraft/-/issues"
Changelog = "https://gitlab.com/andy-freund/LR-FolderCraft/-/blob/main/CHANGELOG.md"

[project.scripts]
lrfc = "lrfoldercraft.cli:main"
lr-foldercraft = "lrfoldercraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lrfoldercraft = ["tui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# The 3.9 baseline and the logging convention are deliberate, not oversights:
#   UP006/UP007/UP035/UP045  keep typing.List / Optional[...] -- the package must
#                            import on Python 3.9, where PEP 604 unions are only
#                            legal inside annotations.
#   UP032                    keep str.format() in messages, so logging calls stay
#                            lazy and no message is formatted that is never emitted.
ignore = ["UP006", "UP007", "UP035", "UP045", "UP032"]

[tool.ruff.lint.per-file-ignores]
# TOKEN_SPECS is a declarative table; one row per line reads far better than
# wrapping every bilingual description across three lines.
"src/lrfoldercraft/rules.py" = ["E501"]
