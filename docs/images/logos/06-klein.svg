    <path d="M6 32h9"/>
    <path d="M12 25l7 7-7 7"/>
  </g>
  <path d="M22 18a4 4 0 0 1 4-4h8l4 5h20a4 4 0 0 1 4 4v27a4 4 0 0 1-4 4H26a4 4 0 0 1-4-4z"
        fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="4"
        stroke-linejoin="round"/>
  <text x="42" y="43" text-anchor="middle" fill="currentColor"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="700" letter-spacing=".5">LR</text>
</svg>
