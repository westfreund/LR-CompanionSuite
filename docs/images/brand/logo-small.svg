<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="LR-FolderCraft">
  <title>LR-FolderCraft</title>
  <desc>One folder over the LR monogram: the small cut of the mark.</desc>
  <!--
    The small cut, for 16 and 24 px: favicon, window icon, tab strip. The full
    mark has four elements and none of them survive sixteen pixels, so this
    keeps the two that carry the meaning, a folder and the monogram, with the
    strokes thickened to hold up at that size.

    Same colour rule: everything is currentColor.

    Note for anyone editing these files: a double hyphen is illegal inside an
    XML comment. It does not raise an error anywhere obvious; the renderer
    simply produces an empty image.
  -->
  <path d="M5 16a4 4 0 0 1 4-4h11l4 5h35a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"
        fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="4"
        stroke-linejoin="round"/>
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M19.5 41v14h8"/>
    <path d="M34.5 55V41h4.6a4.4 4.4 0 0 1 0 8.8h-4.6"/>
    <path d="m38.9 49.8 4.6 5.6"/>
  </g>
</svg>
