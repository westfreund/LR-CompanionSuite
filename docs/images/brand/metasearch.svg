<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="LR-MetaSearch">
  <title>LR-MetaSearch</title>
  <desc>A lens over a stack of libraries, above the LR monogram.</desc>
  <!--
    Tool two of the suite. It shares the family: one colour through
    `currentColor`, the same 2.5 stroke, the same rule and the same LR monogram
    drawn as strokes rather than set as type.

    Where LR-FolderCraft shows scattered frames becoming ordered folders, this
    shows several libraries stacked and a lens held over them. The stack says
    "more than one catalog", which is the whole reason the tool exists.

    Editing note: a double hyphen is illegal inside an XML comment. It raises
    no error anywhere obvious; the renderer simply produces an empty image.
  -->

  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round">
    <rect x="6" y="6" width="34" height="10" rx="2.5" opacity=".45"/>
    <rect x="6" y="19" width="34" height="10" rx="2.5" opacity=".7"/>
    <rect x="6" y="32" width="34" height="10" rx="2.5"/>
  </g>

  <g fill="currentColor" opacity=".16">
    <rect x="7.25" y="33.25" width="31.5" height="7.5" rx="1.5"/>
  </g>

  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <circle cx="43" cy="22" r="11"/>
    <path d="M51 30 L59 38"/>
  </g>

  <path d="M5 48h54" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".38"
        stroke-linecap="round"/>

  <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M23 50v11h6.6"/>
    <path d="M34.6 61V50h3.6a3.2 3.2 0 0 1 0 6.4h-3.6"/>
    <path d="m38.2 56.4 3.2 4.6"/>
  </g>
</svg>
